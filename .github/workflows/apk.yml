name: apk

# 뷰어 APK 를 굽는다. APK 안에는 콘텐츠가 없다 —
# 문제도 풀이도 앱 첫 실행에 적은 각자의 git 저장소에서 받아 오므로, 이 APK 하나를 누구나 쓴다.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        run: gradle -p app :reader:assembleRelease --console=plain

      - name: 이름 정리
        run: |
          mkdir -p dist
          cp app/reader/build/outputs/apk/release/*.apk dist/algo-reader.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: algo-reader-apk
          path: dist/algo-reader.apk

      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/algo-reader.apk
