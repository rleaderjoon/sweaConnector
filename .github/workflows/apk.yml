name: apk

# 데모 APK 를 굽는다. 공개 저장소이므로 내용은 fixtures(가상 문제)다.
# 자기 내용으로 굽고 싶으면 이 저장소를 fork 한 뒤 아래 STUDY_REPO 를 자기 학습 저장소로 바꾸고,
# 그 저장소를 checkout 하는 단계를 추가하면 된다 (private 이면 PAT 이 필요하다).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  STUDY_REPO: fixtures/sample-study-repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 콘텐츠 추출
        run: |
          mkdir -p app/reader/src/main/assets
          node pipeline/extract.mjs --repo "$STUDY_REPO" --out app/reader/src/main/assets/content.json

      - name: APK 빌드
        run: gradle -p app :reader:assembleRelease --console=plain

      - name: 이름 정리
        run: |
          mkdir -p dist
          cp app/reader/build/outputs/apk/release/*.apk dist/algo-reader-demo.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: algo-reader-demo-apk
          path: dist/algo-reader-demo.apk

      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/algo-reader-demo.apk
