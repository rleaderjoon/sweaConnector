<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240">
  <!-- gen 카운터 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.4">
    <rect x="40" y="30" width="52" height="34" rx="2"/>
  </g>

  <!-- stamp 배열: 8칸 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.4">
    <rect x="40" y="110" width="46" height="40"/>
    <rect x="86" y="110" width="46" height="40"/>
    <rect x="132" y="110" width="46" height="40"/>
    <rect x="178" y="110" width="46" height="40"/>
    <rect x="224" y="110" width="46" height="40"/>
    <rect x="270" y="110" width="46" height="40"/>
    <rect x="316" y="110" width="46" height="40"/>
    <rect x="362" y="110" width="46" height="40"/>
  </g>

  <!-- 이번 세대에 실제로 건드린 칸만 채워진다 -->
  <g fill="#1a1a1a" opacity="0.08">
    <rect x="87" y="111" width="44" height="38"/>
    <rect x="225" y="111" width="44" height="38"/>
    <rect x="317" y="111" width="44" height="38"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">
    <text x="66" y="53">7</text>
    <text x="63" y="136">3</text>
    <text x="109" y="136">7</text>
    <text x="155" y="136">1</text>
    <text x="201" y="136">5</text>
    <text x="247" y="136">7</text>
    <text x="293" y="136">2</text>
    <text x="339" y="136">7</text>
    <text x="385" y="136">4</text>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#8a8a8a">
    <text x="102" y="52">gen — 이번 테스트케이스 번호</text>
    <text x="40" y="100">stamp[i]</text>
    <text x="40" y="180">stamp[i] == gen 이면 유효한 값, 아니면 초기값으로 취급</text>
    <text x="40" y="202">init() 에서 배열을 지우지 않는다 — gen++ 한 번이 전체 초기화</text>
    <text x="40" y="224">O(N) 초기화 x TC 50개  →  O(1) x 50</text>
  </g>
</svg>
